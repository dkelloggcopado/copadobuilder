# Copado Function definition (install via Copado UI or CLI)
apiName: builder_deploy_package
name: Builder Deploy Package
description: >
  Materializes Copado Builder package JSON into force-app/ and deploys it to the
  User Story Org Credential so a subsequent Copado commit can retrieve real metadata.
# Must be a Salesforce CLI image that includes `sf` (or `sfdx`).
# copado-function-core:v1 does NOT include the CLI. Use the same image your org
# uses for sfdx_commit_1 / sfdx_deploy_1 (commonly a copado-multicloud-dx image).
image: copado-multicloud-dx
timeout: 60
parameters:
  - name: DataJson
    required: true
    description: Job Execution DataJson from Copado Builder
  - name: sessionId
    required: true
    description: Target org session — map to {$Source.Credential.SessionId}
  - name: endpoint
    required: true
    description: Target org base URL — prefer {$Source.Credential.EndpointURL}
